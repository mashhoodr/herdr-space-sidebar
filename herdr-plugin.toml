id = "spaces-list"
name = "Spaces List"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "One list of spaces with their agents nested underneath."
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Toggle spaces list"
description = "Open the list in this tab, focus it if open, close it if focused."
command = ["python3", "spaces_list.py", "--toggle"]

[[actions]]
id = "find"
title = "Find in spaces list"
description = "Open or focus the list and start filtering."
command = ["python3", "spaces_list.py", "--find"]

[[panes]]
id = "list"
title = "Spaces"
placement = "split"
command = ["python3", "spaces_list.py"]

# Herdr restores plugin panes as plain shells after a restart, so restart them.
[[startup]]
command = ["python3", "spaces_list.py", "--startup"]

# Moving to a tab fires these even for new tabs and spaces. pane.focused is left
# out on purpose: docking moves focus, and that must not re-trigger the hook.
[[events]]
on = "tab.focused"
command = ["python3", "spaces_list.py", "--ensure"]

[[events]]
on = "workspace.focused"
command = ["python3", "spaces_list.py", "--ensure"]

# Step aside while a herdr-sidebar file preview is open, and come back after.
[[events]]
on = "pane.created"
command = ["python3", "spaces_list.py", "--pane-changed"]

[[events]]
on = "pane.closed"
command = ["python3", "spaces_list.py", "--pane-changed"]
